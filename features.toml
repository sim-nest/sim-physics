schema = "sim.features"
[enforcement.audience]
code = "strict"
framework = "strict"
[enforcement.specimen]
user = "strict"
framework = "strict"
code = "strict"
[enforcement.route]
major_entrypoints = "strict"
frameworks = "strict"

[[feature]]
id = "feature/sim-physics/self-contained-analytic-studies"
title = "Self-contained analytic electrical and impact studies"
summary = "Compose event-split conjugate-port work, independent stores, clean selection, refinement, certified thresholds, replay envelopes, and polynomial modal roots in checked synthetic studies with independently derived equations."
owner = "crate/sim-lib-physics-study"
audiences = ["code", "framework", "user"]
guidance = "Start with the checked analytic studies when auditing a switched electrical boundary or a mechanical impact. Preserve one-sided events and impulses, retain provider identities and exact bits, and compare refinements against the equations printed in the specimen rather than an opaque fixture. The known untested region is distributed field/contact discretization; these specimens cover lumped analytic systems only."
claims_anchors = ["anchor/crate/sim-lib-physics-study"]
claims_specimens = ["spec-test/sim-physics/crates/sim-lib-physics-core/tests/boundary_event"]

[[route]]
id = "route/audit-analytic-switched-electrical-study"
task = "Audit a switched lumped electrical study against independent equations"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/self-contained-analytic-studies", why = "The cross-layer integration suite proves two oriented voltage/current ports, a discontinuity, terminal event, stiff interval, independent stores, refinement contraction, and a certified threshold." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-core/tests/boundary_event", why = "Check the common event/topology contract, then run the repository's analytic_studies and analytic_study_routes targets for the public equation-derived composition and metamorphic cases." }]

[[route]]
id = "route/audit-analytic-mechanical-impact"
task = "Audit a mechanical contact impulse with momentum and work equations"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/self-contained-analytic-studies", why = "The cross-layer integration suite retains one-sided impact states, an explicit impulse, independent kinetic stores, clean selection inputs, and momentum/work identities." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-core/tests/boundary_event", why = "Check the common one-sided event/topology contract, then run the repository's analytic_studies and analytic_study_routes targets for momentum, work, provider-envelope, and modal-root proofs." }]
[[feature]]
id = "feature/sim-physics/model-adapter-conformance"
title = "Fail-closed model adapter conformance"
summary = "Lower domain results into stable identities, semantic observations, explicit boundaries, influences, and separated model/solver evidence without upward domain coupling."
owner = "crate/sim-lib-physics-adapter"
guidance = "Implement this contract in the domain repository. Require validate_lumped_audit only when an explicit conjugate effort/flow boundary exists; wave amplitude-squared is an observation, never an inferred port."
claims_anchors = ["anchor/crate/sim-lib-physics-adapter"]
claims_specimens = ["spec-test/sim-physics/crates/sim-lib-physics-adapter/tests/conformance"]

[[route]]
id = "route/adapt-domain-model-to-physics-audit"
task = "Feed a domain model into a physics audit without coupling physics to the domain"
steps = [{ feature = "feature/sim-physics/model-adapter-conformance", why = "Validate identities, boundary completeness, quantities, evidence, and influences." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-adapter/tests/conformance", why = "Prove missing-port refusal and evidence/origin separation." }]

[[feature]]
id = "feature/sim-physics/boundary-event-core"
title = "Lumped-system boundary and event core"
summary = "Validate immutable boundaries, stores, declared ports, semantic time spans, ordered events, and signed-power transfers before solving."
owner = "crate/sim-lib-physics-core"
audiences = ["code", "framework", "user"]
guidance = "Use this core for lumped dynamic studies. Compose sim-numbers quantities and existing Shape, content-id, Claim, read-construct, cookbook, and Index contracts; keep numerical methods, field solvers, scheduling, persistence, codecs, effects, and kernel types in their owners."
claims_anchors = ["anchor/crate/sim-lib-physics-core"]
claims_specimens = ["spec-test/sim-physics/crates/sim-lib-physics-core/tests/boundary_event"]
composes = ["crate/sim-lib-numbers-quantity"]
[[route]]
id = "route/model-lumped-boundary-events"
task = "Model a lumped dynamic system with explicit boundaries and events"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/boundary-event-core", why = "The core owns solve-independent topology and signed-power boundary validation." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-core/tests/boundary_event", why = "The specimen proves canonical identity, simultaneous events, and fail-closed topology." }]
[[feature]]
id = "feature/sim-physics/conjugate-port-work"
title = "Conjugate ports and event-split signed work"
summary = "Declare boundary-relative effort/flow pairs and audit continuous work per port while retaining event impulses separately."
owner = "crate/sim-lib-physics-power"
audiences = ["code", "framework", "user"]
guidance = "Compose physics boundary identities, sim-numbers quantity Shapes and trajectory/quadrature owners. Declare orientation once, split at every event, retain per-port method evidence, and never encode an impulse as sampled power."
claims_anchors = ["anchor/crate/sim-lib-physics-power"]
claims_specimens = ["spec-test/sim-physics/crates/sim-lib-physics-power/tests/work"]
composes = ["crate/sim-lib-physics-core", "crate/sim-lib-numbers-quantity"]
[[route]]
id = "route/audit-conjugate-port-work"
task = "Audit signed continuous and impulsive work across physical boundaries"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/boundary-event-core", why = "Declare the boundary and crossing port identities." }, { feature = "feature/sim-physics/conjugate-port-work", why = "Pair effort and flow, orient the port, split continuous work at events, and retain impulses separately." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-power/tests/work", why = "The specimen proves analytic domains, orientation, discontinuities, simultaneous events, and pure impulses." }, { specimen = "recipe/sim-physics/01-power/switched-two-port", why = "Run a switched electrical-to-mechanical two-port audit." }]
[[feature]]
id = "feature/sim-physics/stored-energy-audit"
title = "Independent stored-energy audit"
summary = "Evaluate endpoint stores independently and preserve typed residual and uncertainty lanes in an immutable content-identified audit."
owner = "crate/sim-lib-physics-audit"
audiences = ["code", "framework", "user"]
guidance = "Compose the boundary and signed-work owners with constitutive endpoint evaluators. Keep every port and event term, declare reduction and uncertainty combination rules, and report energy discrepancy as an observation rather than dissipation."
claims_anchors = ["anchor/crate/sim-lib-physics-audit"]
claims_specimens = ["spec-test/sim-physics/crates/sim-lib-physics-audit/tests/audit"]
composes = ["crate/sim-lib-physics-core", "crate/sim-lib-physics-power", "crate/sim-lib-numbers-method", "crate/sim-lib-numbers-quantity", "crate/sim-kernel"]
[[route]]
id = "route/audit-independent-stored-energy"
task = "Audit stored-energy balance without deriving endpoint stores from transferred work"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/conjugate-port-work", why = "Retain signed continuous work and event transfers at the declared boundary." }, { feature = "feature/sim-physics/stored-energy-audit", why = "Evaluate both endpoint states constitutively and compute the visible balance with typed evidence lanes." }, { specimen = "spec-test/sim-physics/crates/sim-lib-physics-audit/tests/audit", why = "The specimen proves independent perturbations, sign and omission failures, distinct residuals, and separated uncertainty." }, { specimen = "recipe/sim-physics/02-audit/stored-energy", why = "Inspect the equation, Shapes, and runtime exports." }]
[[feature]]
id = "feature/sim-physics/certified-orthogonal-refinement"
title = "Certified orthogonal refinement"
summary = "Refine independent numerical and model axes, retain signed comparisons, and issue definite threshold verdicts only from certified enclosures."
owner = "crate/sim-lib-physics-proof"
audiences = ["code", "framework", "user"]
guidance = "Compose physics audit evidence with sim-numbers interval, extended-precision, and method layers. Keep all six refinement axes and threshold lanes explicit; refinement spreads are estimates and cannot certify a verdict."
claims_anchors = ["anchor/crate/sim-lib-physics-proof"]
claims_specimens = ["recipe/sim-physics/03-proof/certified-refinement"]
composes = ["crate/sim-lib-physics-audit", "crate/sim-lib-numbers-interval", "crate/sim-lib-numbers-extended", "crate/sim-lib-numbers-method"]
[[route]]
id = "route/certify-physics-refinement"
task = "Distinguish numerical convergence from a certified mathematical-model verdict"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/stored-energy-audit", why = "Retain independent audit evidence lanes." }, { feature = "feature/sim-physics/certified-orthogonal-refinement", why = "Refine each assumption explicitly and require a sealed enclosure for definite claims; its crate integration tests prove sign reversal, non-monotonicity, independent failures, refusal of estimates, continuation diagnoses, and reproducible identity." }, { specimen = "recipe/sim-physics/03-proof/certified-refinement", why = "Inspect event-exact meshing and runtime exports." }]

[[feature]]
id = "feature/sim-physics/no-energy-selection"
title = "Proof-backed no-energy-selection audit"
summary = "Refuse selection, ranking, sizing, and control inputs influenced by energy-derived observations, including laundering through dimension changes and opaque code."
owner = "crate/sim-lib-physics-influence"
audiences = ["code", "framework", "user"]
guidance = "Compose the one generic sim-incremental-core dataflow engine. Declare every study operation and dependency, treat unchecked native transforms as Unknown, and admit a SelectionInput only from the resulting clean completion proof. There is no capability override."
claims_anchors = ["anchor/crate/sim-lib-physics-influence"]
claims_specimens = ["recipe/sim-physics/04-influence/refused-selection"]
composes = ["crate/sim-incremental-core", "crate/sim-kernel"]

[[route]]
id = "route/refuse-energy-influenced-selection"
task = "Prove that a physical-study selection input is independent of energy"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/no-energy-selection", why = "Apply the fail-closed influence domain over the canonical incremental engine, protected sinks, native type-state, and runtime Shape preparation; its crate integration suite proves direct and laundered influence, branches, joins, loops, opaque code, clean preparation, budget refusal, and incremental edits." }, { specimen = "recipe/sim-physics/04-influence/refused-selection", why = "Run a divide-by-time laundering refusal and inspect its causal path." }]

[[feature]]
id = "feature/sim-physics/immutable-placement-studies"
title = "Immutable placement-transparent physics studies"
summary = "Review semantic sweep plans before execution and retain sampling, partition, placement, partial-outcome, replay, provider-envelope, and explicit coverage-gap evidence."
owner = "crate/sim-lib-physics-study"
audiences = ["code", "framework", "user"]
guidance = "Use StudyPlan for parameter studies that must bind model and content identity, boundary/event graph, initial state, methods, refinements, semantic quantity Shapes, exact boundary cases, statistical partitions, outputs, limits, seed, policies, and placement before execution. Grid, Latin, and Sobol designs compose the canonical stats evidence. Submit independent points through realize_sweep and EvalFabric; do not add a scheduler, executor, transport, site, or Tensor fork. Require SelectionInput for selection and attach energy Observations only after choosing. Preserve refused, interrupted, and unknown outcomes without inferring retry safety from lost contact."
claims_anchors = ["anchor/crate/sim-lib-physics-study"]
claims_specimens = ["recipe/sim-physics/05-study/placement-sweep"]
composes = ["crate/sim-lib-numbers-stats", "feature/sim-physics/no-energy-selection", "crate/sim-kernel"]

[[route]]
id = "route/run-placement-transparent-physics-study"
task = "Run a reviewable physics parameter sweep without coupling it to execution placement"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/immutable-placement-studies", why = "Bind the immutable plan, generate canonical coverage evidence, preserve statistical partitions, and submit independent points through EvalFabric; Tensor-backed models retain their ordinary TensorSite placement beneath that fabric boundary. The crate integration suite proves boundaries, partitions, sampler replay, placement parity, partial failure, interruption, deterministic replay, provider envelopes, and explicit gaps." }, { feature = "feature/sim-physics/no-energy-selection", why = "Produce the clean influence proof required by the selection API while leaving energy outside the choice." }, { specimen = "recipe/sim-physics/05-study/placement-sweep", why = "Inspect a small inclusive sweep with an exact injected case and an explicit untested region." }]

[[feature]]
id = "feature/sim-physics/immutable-finding-history"
title = "Immutable branch-preserving finding histories"
summary = "Store surprising observations and every successor by content identity while preserving concurrent explanations and rebuilding disposable query projections."
owner = "crate/sim-lib-physics-findings"
audiences = ["code", "framework", "user"]
guidance = "Compose kernel ContentId and Claim with sim-table-core validated paths and an injected sim-storage HostDirPort. Append typed successors with new evidence; reconcile competing heads explicitly. Do not use a ledger, SQL, filesystem paths, mutable records, or last-writer-wins."
claims_anchors = ["anchor/crate/sim-lib-physics-findings"]
claims_specimens = ["recipe/sim-physics/06-findings/sweep-to-finding"]
composes = ["crate/sim-kernel", "crate/sim-table-core", "crate/sim-storage-port"]

[[route]]
id = "route/preserve-physics-finding-history"
task = "Preserve and investigate a surprising physics result without erasing competing explanations"
audiences = ["code", "framework", "user"]
steps = [{ feature = "feature/sim-physics/immutable-placement-studies", why = "Produce reviewable sweep evidence and stable study identity." }, { feature = "feature/sim-physics/immutable-finding-history", why = "Publish the observation, append evidence-bearing successors, retain branches, and rebuild read-only projections from immutable records. Its crate integration suite proves identity, backend parity, interrupted and concurrent append, corruption refusal, branch reconciliation, rebuild, complete history, and redaction." }, { specimen = "recipe/sim-physics/06-findings/sweep-to-finding", why = "Convert one sweep residual into an open finding." }]
