[workspace]
resolver = "3"
members = ["crates/sim-lib-physics-core", "recipes/00-overview/boundary-event", "xtask"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-physics"
homepage = "https://github.com/sim-nest/sim-physics"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-citizen-derive = { path = "../sim-citizen/crates/sim-citizen-derive" }
sim-cookbook = { path = "../sim-foundation/crates/sim-cookbook" }
sim-cookbook-build = { path = "../sim-foundation/crates/sim-cookbook-build" }
sim-kernel = { path = "../sim-kernel" }
sim-shape = { path = "../sim-shape" }
