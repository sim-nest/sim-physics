[workspace]
resolver = "3"
members = [
    "crates/sim-lib-physics-core",
    "crates/sim-lib-physics-power",
    "crates/sim-lib-physics-audit",
    "crates/sim-lib-physics-proof",
    "crates/sim-lib-physics-influence",
    "crates/sim-lib-physics-study",
    "crates/sim-lib-physics-findings",
    "crates/sim-lib-physics-adapter",
    "crates/sim-lib-physics-runtime",
    "recipes/00-overview/boundary-event",
    "recipes/01-power/switched-two-port",
    "recipes/02-audit/stored-energy",
    "recipes/03-proof/certified-refinement",
    "recipes/04-influence/refused-selection",
    "recipes/05-study/placement-sweep",
    "recipes/06-findings/sweep-to-finding",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-physics"
homepage = "https://github.com/sim-nest/sim-physics"

[workspace.lints.rust]
unsafe_code = "forbid"
